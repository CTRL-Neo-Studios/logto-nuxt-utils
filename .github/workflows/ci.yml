name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run test:types

      # Runs before the tests on purpose: `dev:prepare` leaves a stubbed `dist/`
      # containing only the module entry, so the exports-map integrity checks (and
      # the fixture's package-subpath import) are only meaningful against a real
      # build. This is the gap that previously let a broken subpath ship.
      - name: Build
        run: pnpm run prepack

      - name: Test
        run: pnpm run test
